<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Elektron Kutubxona – Zamonaviy raqamli kutubxona va AI platformasi.">
  <title>📚 ELEKTRON KUTUBXONA | Boshqaruv & AI Platformasi</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- App CSS -->
  <link rel="stylesheet" href="/static/css/style.css?v=7">

  <!-- Libraries (CDN) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
<div id="app" class="app-wrapper">

  <!-- ======================================================
       LOGIN SCREEN
       ====================================================== -->
  <div class="login-overlay" v-if="!isLoggedIn">
    <div class="login-card">
      <div style="display: flex; justify-content: center; margin-bottom: 16px;">
        <img src="/static/img/urgut_logo.png" alt="Urgut AKM" style="width: 72px; height: 72px; border-radius: 50%; object-fit: contain; background: #ffffff; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); border: 2px solid #C8A951;">
      </div>
      <h2 class="login-title" style="font-family: 'Outfit', sans-serif; font-weight:800; text-align:center;">URGUT TUMAN AKM</h2>
      <p class="login-subtitle" style="text-align:center; font-size:0.85rem; margin-bottom:24px;">Axborot-kutubxona markazi & AI platformasi</p>
      
      <div class="form-group" style="margin-bottom:16px;text-align:left">
        <label class="form-label">Foydalanuvchi nomi</label>
        <input class="form-control" v-model="loginForm.username" placeholder="admin" @keyup.enter="login">
      </div>
      <div class="form-group" style="margin-bottom:16px;text-align:left">
        <label class="form-label">Parol</label>
        <input class="form-control" type="password" v-model="loginForm.password" placeholder="••••••••" @keyup.enter="login">
      </div>
      <div class="form-group" style="margin-bottom:24px;text-align:left">
        <label class="form-label">Tizim roli</label>
        <select class="form-control" v-model="loginForm.role">
          <option value="admin">🛡️ Administrator</option>
          <option value="operator">👤 Operator</option>
        </select>
      </div>
      
      <button class="btn btn-primary" style="width:100%; justify-content:center; padding:12px; font-size:0.95rem; font-weight:700;" @click="login">
        Tizimga Kirish 🚀
      </button>
    </div>
  </div>

  <template v-if="isLoggedIn">
  <!-- ======================================================
       SIDEBAR (Screenshots 1 & 2)
       ====================================================== -->
  <aside class="sidebar" :class="{ open: sidebarOpen, collapsed: sidebarCollapsed }" id="sidebar">
    <!-- Brand Logo -->
    <div class="sidebar-logo">
      <img src="/static/img/urgut_logo.png" alt="Urgut AKM" style="width:40px; height:40px; border-radius:50%; object-fit:contain; background:#ffffff; padding:2px; flex-shrink:0; border:1px solid #C8A951;">
      <div class="logo-text">
        <h2 style="font-size: 1.02rem; font-weight: 800; letter-spacing: 0.5px; color: #FFFFFF; font-family:'Outfit',sans-serif; margin:0;">URGUT AKM</h2>
        <span style="font-size: 0.65rem; color: #8E9CAA; display:block;">Axborot-kutubxona markazi</span>
      </div>
      <button class="sidebar-collapse-btn" @click="toggleSidebarCollapse" :title="sidebarCollapsed ? 'Kengaytirish' : 'Qisqartirish'">
        <span v-if="sidebarCollapsed">▶</span>
        <span v-else>◀</span>
      </button>
    </div>

    <!-- Navigation Menu -->
    <div class="sidebar-nav">
      <div class="nav-section-label">Asosiy menyu</div>

      <div class="nav-item" :class="{ active: currentPage==='dashboard' }" @click="navigate('dashboard')" title="Dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-text">Dashboard</span>
      </div>

      <div class="nav-item" :class="{ active: currentPage==='books' || currentPage==='book_detail' }" @click="navigate('books')" title="Kitoblar">
        <span class="nav-icon">📚</span>
        <span class="nav-text">Kitoblar</span>
      </div>

      <div class="nav-item" :class="{ active: currentPage==='members' || currentPage==='member_profile' }" @click="navigate('members')" title="Kitobxonlar">
        <span class="nav-icon">👤</span>
        <span class="nav-text">Kitobxonlar</span>
        <span class="nav-badge" v-if="dashStats && dashStats.kutilmoqda_members > 0">{{ dashStats.kutilmoqda_members }}</span>
      </div>

      <div class="nav-item" :class="{ active: currentPage==='issues' }" @click="navigate('issues')" title="Kitob Berish">
        <span class="nav-icon">📖</span>
        <span class="nav-text">Kitob Berish</span>
      </div>

      <div class="nav-item" :class="{ active: currentPage==='reservations' }" @click="navigate('reservations')" title="Rezervatsiyalar">
        <span class="nav-icon">🔖</span>
        <span class="nav-text">Rezervatsiyalar</span>
        <span class="nav-badge" v-if="reservationsList && reservationsList.length > 0">{{ reservationsList.length }}</span>
      </div>

      <div class="nav-section-label">AI Modullari</div>

      <div class="nav-item" :class="{ active: currentPage==='ai_search' }" @click="navigate('ai_search')" title="AI Qidiruv">
        <span class="nav-icon">✨</span>
        <span class="nav-text">AI Qidiruv</span>
        <span class="nav-badge-ai">AI</span>
      </div>

      <div class="nav-section-label">Xizmatlar & Tahlil</div>

      <div class="nav-item" :class="{ active: currentPage==='extensions' }" @click="navigate('extensions')" title="Muddat Uzaytirish">
        <span class="nav-icon">⏳</span>
        <span class="nav-text">Muddat Uzaytirish</span>
      </div>

      <div class="nav-item" :class="{ active: currentPage==='reports' }" @click="navigate('reports')" title="Hisobotlar">
        <span class="nav-icon">📈</span>
        <span class="nav-text">Hisobotlar</span>
      </div>

      <div class="nav-item" :class="{ active: currentPage==='notifications_page' }" @click="navigate('notifications_page')" title="Bildirishnomalar">
        <span class="nav-icon">🔔</span>
        <span class="nav-text">Bildirishnomalar</span>
        <span class="nav-badge" v-if="notifications && notifications.length > 0">{{ notifications.length }}</span>
      </div>

      <div class="nav-item" :class="{ active: currentPage==='finance' }" @click="navigate('finance')" title="Moliya">
        <span class="nav-icon">💰</span>
        <span class="nav-text">Moliya</span>
      </div>

      <div class="nav-section-label">Boshqaruv</div>

      <div class="nav-item" v-if="auth.role === 'admin'" :class="{ active: currentPage==='import' }" @click="navigate('import')" title="Excel Import">
        <span class="nav-icon">📥</span>
        <span class="nav-text">Excel Import</span>
      </div>

      <div class="nav-item" v-if="auth.role === 'admin'" :class="{ active: currentPage==='audit_log' }" @click="navigate('audit_log')" title="Audit Log">
        <span class="nav-icon">📋</span>
        <span class="nav-text">Audit Log</span>
      </div>

      <div class="nav-item" v-if="auth.role === 'admin'" :class="{ active: currentPage==='backup' }" @click="navigate('backup')" title="Zaxira Nusxa">
        <span class="nav-icon">💾</span>
        <span class="nav-text">Zaxira Nusxa</span>
      </div>

      <div class="nav-item" :class="{ active: currentPage==='settings' }" @click="navigate('settings')" title="Sozlamalar">
        <span class="nav-icon">⚙️</span>
        <span class="nav-text">Sozlamalar</span>
      </div>

      <div class="nav-item" @click="logout" title="Tizimdan Chiqish">
        <span class="nav-icon">🚪</span>
        <span class="nav-text">Chiqish</span>
      </div>
    </div>

    <!-- Sidebar Bottom AI Glowing Card (Screenshot 1 & 2) -->
    <div class="sidebar-ai-card" v-if="!sidebarCollapsed">
      <div class="ai-avatar-glow">🤖</div>
      <div class="ai-card-title">AI Kutubxonachi</div>
      <div class="ai-card-sub">Yordam kerakmi? Savollaringiz bormi? AI yordamchini chaqiring.</div>
      <button class="btn-ai-try" @click="toggleChat()">✨ AI Chatni ochish</button>
    </div>

    <!-- Sidebar Footer User Profile -->
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" style="background:linear-gradient(135deg, #1E3A5F, #3B82F6);">
          {{ auth.username ? auth.username[0].toUpperCase() : 'A' }}
        </div>
        <div class="user-info">
          <div class="user-name">{{ auth.username || 'Zamira Murtazoyeva' }}</div>
          <div class="user-role">{{ auth.role === 'admin' ? 'Administrator' : 'Operator' }}</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ======================================================
       MAIN CONTENT WRAPPER
       ====================================================== -->
  <div class="main-content">

    <!-- Topbar (Screenshot 1) -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-hamburger" @click="sidebarOpen = !sidebarOpen">☰</button>
        <div>
          <h1 style="margin:0; font-size:1.15rem; font-weight:800; font-family:'Outfit',sans-serif; letter-spacing:-0.3px;">
            <span v-if="currentPage==='dashboard'">📊 Dashboard</span>
            <span v-else-if="currentPage==='books'">📚 Kitoblar Katalogi</span>
            <span v-else-if="currentPage==='book_detail'">📖 Kitob Tafsilotlari</span>
            <span v-else-if="currentPage==='members'">👤 Kitobxonlar Boshqaruvi</span>
            <span v-else-if="currentPage==='member_profile'">👤 Kitobxon Profili</span>
            <span v-else-if="currentPage==='issues'">📖 Kitob Berish Jurnali</span>
            <span v-else-if="currentPage==='reservations'">🔖 Band Qilingan Kitoblar</span>
            <span v-else-if="currentPage==='ai_search'">✨ AI Aqlli Qidiruv</span>
            <span v-else-if="currentPage==='extensions'">⏳ Muddat Uzaytirish</span>
            <span v-else-if="currentPage==='reports'">📈 Statistika & Hisobotlar</span>
            <span v-else-if="currentPage==='notifications_page'">🔔 Barcha Bildirishnomalar</span>
            <span v-else-if="currentPage==='finance'">💰 Moliya va To'lovlar</span>
            <span v-else-if="currentPage==='import'">📥 Excel Import</span>
            <span v-else-if="currentPage==='audit_log'">📋 Tizim Harakatlari (Audit)</span>
            <span v-else-if="currentPage==='backup'">💾 Zaxira Nusxalar</span>
            <span v-else-if="currentPage==='settings'">⚙️ Tizim Sozlamalari</span>
          </h1>
          <div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">
            ELEKTRON KUTUBXONA / {{ currentPage === 'dashboard' ? 'Boshqaruv paneli' : currentPage }}
          </div>
        </div>
      </div>

      <!-- Topbar Global Search with Mic Icon -->
      <div class="topbar-search-box">
        <span class="icon-left">🔍</span>
        <input type="text" placeholder="Kitob, muallif, kitobxon yoki mavzu bo'yicha qidiring..." 
               v-model="globalSearchQuery" @keyup.enter="handleGlobalSearch">
        <span class="icon-mic" title="Ovozli qidiruv" @click="navigate('ai_search')">🎤</span>
      </div>

      <!-- Topbar Right Actions -->
      <div class="topbar-right">
        <!-- AI Search Button -->
        <button class="btn-ai-glow" @click="navigate('ai_search')" title="AI orqali semantik qidiruv">
          <span>✨ AI qidiruv</span>
        </button>

        <!-- QR Scanner Button -->
        <button class="btn btn-secondary btn-sm" @click="openQRModal" title="QR kod orqali kitobxonni topish" style="border-radius:var(--radius-full);">
          📷 QR Skaner
        </button>

        <!-- Theme Toggle Pill -->
        <div class="theme-switch-pill" @click="toggleTheme" title="Mavzuni almashtirish">
          <div class="pill-dot" :class="{ active: theme === 'light' }">☀️</div>
          <div class="pill-dot" :class="{ active: theme === 'dark' }">🌙</div>
        </div>

        <!-- Notification Bell with Dropdown -->
        <div style="position:relative;">
          <button class="notif-bell-btn" @click="showNotifications = !showNotifications">
            🔔
            <span class="bell-badge" v-if="notifications.length > 0">{{ notifications.length }}</span>
          </button>
          <div class="notification-dropdown" v-if="showNotifications" style="position:absolute; top:calc(100% + 10px); right:0; width:340px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-lg); z-index:200; overflow:hidden;">
            <div style="padding:12px 16px; border-bottom:1px solid var(--border-light); display:flex; justify-content:space-between; align-items:center;">
              <span style="font-weight:700; font-size:0.85rem;">🔔 Bildirishnomalar</span>
              <span class="badge badge-blue">{{ notifications.length }} ta</span>
            </div>
            <div style="max-height:300px; overflow-y:auto;">
              <div class="notif-item-row" v-for="(n, i) in notifications" :key="i" style="padding:10px 14px; cursor:pointer;" @click="navigate('notifications_page'); showNotifications=false">
                <div class="notif-icon-box" :class="n.type === 'warning' ? 'yellow' : (n.type === 'ai' ? 'purple' : 'blue')">
                  {{ n.type === 'warning' ? '⚠️' : (n.type === 'ai' ? '🤖' : 'ℹ️') }}
                </div>
                <div class="notif-details">
                  <div class="notif-title">{{ n.message }}</div>
                  <div class="notif-time">{{ n.created_at || 'Hozirgina' }}</div>
                </div>
              </div>
              <div v-if="!notifications.length" style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.82rem;">
                ✨ Yangi bildirishnomalar yo'q
              </div>
            </div>
            <div style="padding:8px 12px; background:var(--bg-surface); text-align:center; border-top:1px solid var(--border-light);">
              <a href="javascript:void(0)" @click="navigate('notifications_page'); showNotifications=false" style="font-size:0.75rem; color:var(--info); font-weight:600; text-decoration:none;">Barchasini ko'rish →</a>
            </div>
          </div>
        </div>

        <!-- User Profile Widget -->
        <div class="user-profile-widget" @click="navigate('settings')" title="Profil sozlamalari">
          <div class="leaderboard-avatar" style="width:34px; height:34px; font-size:13px; font-weight:800;">
            {{ auth.username ? auth.username[0].toUpperCase() : 'Z' }}
          </div>
          <div class="user-text-info">
            <span class="user-name">{{ auth.username || 'Zamira Murtazoyeva' }}</span>
            <span class="user-role">{{ auth.role === 'admin' ? 'Administrator' : 'Operator' }}</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Body -->
    <main class="page-body">

      <!-- ======================================================
           1. DASHBOARD PAGE (Screenshot 1)
           ====================================================== -->
      <section v-if="currentPage==='dashboard'">
        <div v-if="dashLoading" class="loading-overlay"><div class="spinner"></div></div>
        <template v-else-if="dashStats">

          <!-- Dashboard Banner Row -->
          <div class="dashboard-banner-grid">
            <!-- Left Banner: Welcome Card -->
            <div class="welcome-banner-card">
              <div>
                <h2>Xush kelibsiz, {{ auth.username || 'Zamira' }}! 👋</h2>
                <p>Bugun <b>{{ today }}</b>. Tizimda <b>{{ notifications.length || 0 }} ta</b> bildirishnoma va <b>{{ dashStats.kutilmoqda_members ?? 0 }} ta</b> kutilayotgan so'rov mavjud.</p>
                <div style="display:flex; gap:10px; margin-top:14px;">
                  <button class="btn btn-primary btn-sm" @click="navigate('reports')">📊 To'liq hisobot</button>
                  <button class="btn btn-secondary btn-sm" @click="openAddBook">➕ Kitob qo'shish</button>
                  <button class="btn btn-secondary btn-sm" @click="openAddMember">👤 Yangi a'zo</button>
                </div>
              </div>
              <div style="font-size:64px; opacity:0.9; margin-left:16px;">📚</div>
            </div>
          </div>

          <!-- 6 KPI Metric Cards Row (Screenshot 1) -->
          <div class="kpi-grid-6">
            <!-- Card 1: Jami kitoblar -->
            <div class="kpi-metric-card" @click="navigate('books')" style="cursor:pointer;">
              <div class="kpi-card-header">
                <div>
                  <div class="kpi-metric-val">{{ (dashStats.total_books ?? 0).toLocaleString() }}</div>
                  <div class="kpi-metric-label">Jami kitoblar</div>
                </div>
                <div class="kpi-metric-icon gold">📚</div>
              </div>
              <div class="kpi-trend-pill up">
                <span>↑ {{ dashStats.books_trend || '+8.4%' }}</span>
                <span class="kpi-trend-sub">fonddagi adabiyotlar</span>
              </div>
            </div>

            <!-- Card 2: Faol kitobxonlar -->
            <div class="kpi-metric-card" @click="navigate('members')" style="cursor:pointer;">
              <div class="kpi-card-header">
                <div>
                  <div class="kpi-metric-val">{{ (dashStats.faol_members ?? 0).toLocaleString() }}</div>
                  <div class="kpi-metric-label">Faol kitobxonlar</div>
                </div>
                <div class="kpi-metric-icon blue">👤</div>
              </div>
              <div class="kpi-trend-pill up">
                <span>↑ {{ dashStats.members_trend || '+12.1%' }}</span>
                <span class="kpi-trend-sub">a'zolar safi</span>
              </div>
            </div>

            <!-- Card 3: Berilgan kitoblar -->
            <div class="kpi-metric-card" @click="navigate('issues')" style="cursor:pointer;">
              <div class="kpi-card-header">
                <div>
                  <div class="kpi-metric-val">{{ dashStats.active_issues !== undefined && dashStats.active_issues !== null ? dashStats.active_issues : (dashStats.today_issues ?? 0) }}</div>
                  <div class="kpi-metric-label">Berilgan kitoblar</div>
                </div>
                <div class="kpi-metric-icon cyan">📖</div>
              </div>
              <div class="kpi-trend-pill up">
                <span>Bugun: {{ dashStats.today_issues ?? 0 }} ta</span>
                <span class="kpi-trend-sub">hozirda qo'lda</span>
              </div>
            </div>

            <!-- Card 4: Qaytarilgan kitoblar -->
            <div class="kpi-metric-card" @click="navigate('issues')" style="cursor:pointer;">
              <div class="kpi-card-header">
                <div>
                  <div class="kpi-metric-val">{{ dashStats.returned_books ?? 0 }}</div>
                  <div class="kpi-metric-label">Qaytarilgan kitoblar</div>
                </div>
                <div class="kpi-metric-icon green">↩️</div>
              </div>
              <div class="kpi-trend-pill up">
                <span>↑ {{ dashStats.returned_trend || '+18.5%' }}</span>
                <span class="kpi-trend-sub">jami qaytarilgan</span>
              </div>
            </div>

            <!-- Card 5: Kutilayotgan a'zolar -->
            <div class="kpi-metric-card" @click="navigate('members')" style="cursor:pointer;">
              <div class="kpi-card-header">
                <div>
                  <div class="kpi-metric-val">{{ dashStats.kutilmoqda_members ?? 0 }}</div>
                  <div class="kpi-metric-label">Kutilayotgan a'zolar</div>
                </div>
                <div class="kpi-metric-icon gold">⏳</div>
              </div>
              <div class="kpi-trend-pill up">
                <span>{{ dashStats.kutilmoqda_members ?? 0 }} ta</span>
                <span class="kpi-trend-sub">tasdiqlash kutilmoqda</span>
              </div>
            </div>

            <!-- Card 6: Muddati o'tgan -->
            <div class="kpi-metric-card" @click="navigate('issues')" style="cursor:pointer;">
              <div class="kpi-card-header">
                <div>
                  <div class="kpi-metric-val">{{ dashStats.overdue_issues ?? 0 }}</div>
                  <div class="kpi-metric-label">Muddati o'tgan</div>
                </div>
                <div class="kpi-metric-icon red">⚠️</div>
              </div>
              <div class="kpi-trend-pill" :class="(dashStats.overdue_issues ?? 0) > 0 ? 'down' : 'up'">
                <span>{{ dashStats.overdue_issues ?? 0 }} ta</span>
                <span class="kpi-trend-sub">muddati o'tgan kitob</span>
              </div>
            </div>
          </div>

          <!-- Middle Section: 4 Columns (Line chart, Bar chart, Category Donut, Notifications) -->
          <div class="middle-dashboard-grid">
            <!-- 1. Kitob berish dinamikasi (Line Chart) -->
            <div class="card">
              <div class="card-title-row">
                <div>
                  <h3>📈 Kitob berish dinamikasi</h3>
                  <div class="card-subtitle">2025-yil oylik ko'rsatkichlar</div>
                </div>
                <div style="display:flex; gap:8px; font-size:0.7rem;">
                  <span style="color:#2563EB; font-weight:700;">● Berilgan</span>
                  <span style="color:#F59E0B; font-weight:700;">● Qaytarilgan</span>
                </div>
              </div>
              <div class="chart-container-wrap" style="height:190px;">
                <canvas id="monthlyLoanChart"></canvas>
              </div>
            </div>

            <!-- 2. Oylik faollik (Bar Chart) -->
            <div class="card">
              <div class="card-title-row">
                <div>
                  <h3>📊 Oylik faollik</h3>
                  <div class="card-subtitle">Oxirgi 6 oy bo'yicha</div>
                </div>
                <span class="badge badge-blue">6 oy</span>
              </div>
              <div class="chart-container-wrap" style="height:190px;">
                <canvas id="activityBarChart"></canvas>
              </div>
            </div>

            <!-- 3. Kitoblar toifalari bo'yicha (Donut Chart with Center Text) -->
            <div class="card">
              <div class="card-title-row">
                <div>
                  <h3>🍩 Toifalar bo'yicha</h3>
                  <div class="card-subtitle">Fond tarkibi</div>
                </div>
                <span class="badge badge-purple">100%</span>
              </div>
              <div class="chart-container-wrap" style="height:140px; position:relative;">
                <canvas id="categoryDonutChart"></canvas>
                <div class="donut-center-label">
                  <div class="donut-center-val">{{ (dashStats.total_books || 12540).toLocaleString() }}</div>
                  <div class="donut-center-sub">Kitob</div>
                </div>
              </div>
              <div class="donut-legend-grid">
                <div class="donut-legend-item"><span><span class="donut-dot" style="background:#2563EB;"></span>Badiiy</span><b>35%</b></div>

#ai-chat-input-area { display:flex; padding:12px; background:var(--bg-card); border-top:1px solid var(--border-light); gap:8px; }
#ai-chat-input { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:20px; outline:none; font-size:13px; background:var(--bg-surface); color:var(--text-primary); }
#ai-send-btn { background:#1E3A5F; color:white; border:none; width:38px; height:38px; border-radius:50%; cursor:pointer; }
</style>

<script>
function toggleChat() {
  const win = document.getElementById('ai-chat-window');
  if (!win) return;
  if (win.style.display === 'none' || !win.classList.contains('show')) {
    win.style.display = 'flex';
    setTimeout(() => win.classList.add('show'), 10);
    const inp = document.getElementById('ai-chat-input');
    if (inp) inp.focus();
  } else {
    win.classList.remove('show');
    setTimeout(() => win.style.display = 'none', 300);
  }
}
window.toggleChat = toggleChat;

function askQuickPrompt(text) {
  const win = document.getElementById('ai-chat-window');
  if (win && (win.style.display === 'none' || !win.classList.contains('show'))) {
    toggleChat();
  }
  const input = document.getElementById('ai-chat-input');
  if (input) {
    input.value = text;
    sendChatMessage();
  }
}
window.askQuickPrompt = askQuickPrompt;
async function sendChatMessage() {
  const input = document.getElementById('ai-chat-input');
  const text = input.value.trim();
  if (!text) return;
  appendMessage('user', text);
  input.value = '';
  try {
    const res = await fetch('/api/ai/chat/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    appendMessage('bot', data.response || 'Javob tayyorlandi.');
  } catch (err) {
    appendMessage('bot', '⚠️ Xatolik yuz berdi. Iltimos qaytadan urinib ko\'ring.');
  }
}
function appendMessage(sender, text) {
  const box = document.getElementById('ai-chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-message ' + sender;
  div.innerHTML = `<div class="msg-avatar">${sender === 'user' ? 'S' : 'AI'}</div><div class="msg-content">${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
</script>

<!-- App JS Logic -->
<script src="/static/js/app.js?v=7"></script>
</body>
</html>
